defaults:
  - r1_restore_schema
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

mode: preflight
output_dir: ''
base_plan_file: ''
base_plan_sha256: ''
catalog_file: ''
catalog_root: ''
evaluation_file: ''
evaluation_sha256: ''
training:
  model:
    arm: R1
    hidden: 128
    levels: 8
    expansion: 4
    coupling_rank: 16
    seed_context: none
    long_memory: none
    memory_hidden: 256
    memory_stride: 64
    head_routing: none
    routing_hidden: 512
    release_routing: none
    release_hidden: 512
    row_consequence: none
  device: cpu
  cpu_threads: 1
  model_seed: 172
  batch_size: 4
  microbatch_size: 2
  learning_rate: 0.0003
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_onsets: 32768
  max_seconds: 14400.0
  resources:
    disk_reserve_bytes: 107374182400
    output_max_bytes: 2147483648

hydra:
  run:
    dir: .
  job:
    chdir: false
  output_subdir: null
