  eval_every: 500
  skip_first_eval_pass: true
  save_every: 250
  log_every: 10
  mps_cleanup_every: 20
  batch_size: 1
  learning_rate: 0.0001
  weight_decay: 0.01

data:
  dataset_root: dataset
  index_path: artifacts/indexes/stage2_control_windows_4k_2to6_dense_local_bpm_norm_unique_le3.parquet
