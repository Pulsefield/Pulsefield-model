control_model:
  d_model: 384
  heads: 8
  layers: 3
  ffn_dim: 1536
  dropout: 0.1
  conv_blocks: 2
  conv_kernel_size: 5
  use_global_memory: true
  global_stride: 16
  global_layers: 2
  global_ffn_dim: 1536
  global_conv_blocks: 1
